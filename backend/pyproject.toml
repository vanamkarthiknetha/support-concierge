[project]
name = "concierge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "google-genai>=2.20.0",
    "langchain-google-genai>=4.3.7",
    "langdetect>=1.0.9",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[project.scripts]
concierge = "concierge.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 96
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concierge"]

[tool.uv]
package = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Typer REQUIRES typer.Option()/Argument() as parameter defaults -- this is the
    # framework's API, not an accident.
    "B008",
    # `datetime.fromisoformat(x.replace("Z", "+00:00"))` is deliberate: the sample
    # data uses the Z suffix and this form stays readable.
    "FURB162",
    # PEP-695 generics would drop the Python <3.12 floor for no benefit here.
    "UP046",
    # `(str, Enum)` over StrEnum is deliberate -- it is what the Pydantic and
    # google-genai response_schema paths are exercised against, and swapping the
    # base class risks a silent serialization change for a cosmetic win.
    "UP042",
    # A non-ASCII char in a regex character class is the POINT (mojibake stripping).
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures and assert on shapes; a few unused names are fine.
"tests/*" = ["S101"]
# The audit SQL is column-aligned on purpose: these queries ARE the deliverable
# for requirement 4, and reflowing them to 96 chars makes them harder to read.
"concierge/store/repository.py" = ["E501"]
